<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f3f6">
  <title>견적서</title>
  <style>
    :root{color-scheme:light;--ink:#17212e;--muted:#687587;--line:#dce2e9;--accent:#245c9c;--paper:#fff;--bg:#f1f3f6}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13px}
    .toolbar{width:min(210mm,calc(100% - 32px));margin:28px auto 14px;display:flex;justify-content:flex-end;gap:9px}
    button{font:inherit;cursor:pointer}
    .toolbar button{border:1px solid #ccd4df;background:#fff;color:#27384c;padding:10px 16px;border-radius:7px;font-weight:700;box-shadow:0 1px 2px #1522380b}
    .toolbar button:hover{border-color:#93a9c2;background:#f8fbff}
    .toolbar .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .toolbar .primary:hover{background:#194b83}
    .paper{width:210mm;min-height:297mm;margin:0 auto 34px;padding:15mm 16mm 13mm;background:var(--paper);box-shadow:0 8px 30px #1d293914;position:relative}
    h1{font-size:30px;letter-spacing:.48em;text-align:center;margin:0 0 19px 0;padding-left:.48em;font-weight:800}
    .top-info{display:grid;grid-template-columns:1fr 1.04fr;gap:15px;align-items:start}
    .recipient{padding:15px 13px 10px;border-bottom:1px solid var(--ink);min-height:104px;display:flex;align-items:flex-start;gap:5px;font-size:15px}
    .recipient label{white-space:nowrap;padding-top:4px;font-weight:700}
    .recipient .recipient-name{font-size:19px;font-weight:700;flex:1}
    .recipient .to{white-space:nowrap;padding-top:5px;font-weight:700}
    .supplier{width:100%;border-collapse:collapse;font-size:11px}
    .supplier th,.supplier td{border:1px solid #929eac;padding:5px 7px;height:26px}
    .supplier th{width:76px;background:#f5f7f9;font-weight:700;white-space:nowrap;text-align:center}
    .supplier td{font-size:12px}
    .quote-meta{margin:15px 0 10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;color:#344356;font-size:11px}
    .meta-item{border-bottom:1px solid #9aa6b4;padding:0 2px 5px;display:flex;gap:7px;align-items:center}
    .meta-item strong{white-space:nowrap;color:#657286}
    .meta-item input{font-weight:600}
    .amount-words{margin:16px 0 9px;padding:11px 13px;background:#f6f8fa;border-left:3px solid var(--accent);font-size:17px;font-weight:800;letter-spacing:.015em}
    .amount-words .numeric{font-size:15px;margin-left:10px;color:#42536a;white-space:nowrap}
    .items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
    .items th,.items td{border:1px solid #7e8b99;padding:0 5px;height:31px}
    .items th{height:29px;background:#eef2f6;text-align:center;font-weight:800;color:#26364a}
    .items td{text-align:center}
    .items td.name{text-align:left}
    .items td.amount{text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
    .items .num{width:7%}.items .product{width:22%}.items .spec{width:16%}.items .qty{width:8%}.items .unit{width:14%}.items .total{width:17%}.items .note{width:12%}.items .actions{width:4%}
    input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%;min-width:0;padding:6px 3px;border-radius:3px}
    input:hover,input:focus{background:#eaf2fb;box-shadow:0 0 0 1px #c6d9ef}
    input[readonly]{cursor:default}
    .items .qty input,.items .unit input,.items .spec input,.items .note input{text-align:center}
    .items td.name input{text-align:left}
    .row-delete{border:0;background:transparent;color:#9ba6b3;font-size:15px;line-height:1;padding:4px 2px;visibility:hidden}
    .items tr:hover .row-delete,.row-delete:focus{visibility:visible;color:#b33f45}
    .totals{width:49%;margin:12px 0 0 auto;border-collapse:collapse;font-size:12px}
    .totals th,.totals td{padding:6px 9px;border-bottom:1px solid #d9dfe6}
    .totals th{text-align:left;color:#536276;font-weight:600}
    .totals td{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    .totals tr:last-child th,.totals tr:last-child td{border-bottom:2px solid #31445a;font-size:15px;color:#172a41}
    .memo{margin-top:22px;border-top:1px solid #cdd4dc;padding-top:9px;color:#647184;font-size:10px}
    .memo input{color:#647184}
    @media(max-width:760px){.toolbar{margin-top:14px}.paper{width:100%;min-height:0;margin:0;padding:22px 16px;overflow-x:auto}.top-info{grid-template-columns:1fr;gap:7px}.recipient{min-height:58px}.quote-meta{grid-template-columns:1fr}.amount-words{font-size:14px}.amount-words .numeric{font-size:12px;margin-left:4px}.items{min-width:620px}.totals{width:70%}}
    @page{size:A4 portrait;margin:0}
    @media print{
      html,body{width:210mm;height:297mm;background:#fff;margin:0!important;padding:0!important}
      body{font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .toolbar,.row-delete{display:none!important}
      .items .actions,.items .action-head,.items .action-cell{display:none!important}
      .paper{width:210mm;height:297mm;min-height:0;margin:0;box-shadow:none;padding:11mm 13mm 9mm;overflow:hidden}
      h1{font-size:25px;margin-bottom:12px}
      .top-info{gap:11px}.recipient{min-height:83px;padding:10px}.supplier th,.supplier td{height:22px;padding:3px 5px}
      .quote-meta{margin:10px 0 7px;gap:8px;font-size:10px}.meta-item{padding-bottom:3px}
      .amount-words{margin:11px 0 7px;padding:8px 10px;font-size:15px}.amount-words .numeric{font-size:13px}
      .items,.supplier{font-size:9px}.items th,.items td{height:25px;padding:0 4px}.items th{height:24px}
      .items input{padding:4px 2px;font-size:9px}
      .totals{margin-top:8px;font-size:10px}.totals th,.totals td{padding:4px 7px}.totals tr:last-child th,.totals tr:last-child td{font-size:12px}
      .memo{margin-top:13px;padding-top:6px;font-size:9px}
      input{box-shadow:none!important;background:transparent!important}
      *{break-inside:avoid}
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="견적서 도구">
    <button type="button" id="add-item">품목 추가</button>
    <button type="button" id="print">인쇄</button>
    <button type="button" class="primary" id="new-quote">새 견적서</button>
  </nav>
  <main class="paper" id="paper">
    <h1>견 적 서</h1>
    <section class="top-info">
      <div class="recipient"><label for="customer">받는 곳</label><input id="customer" class="recipient-name" aria-label="받는 곳 회사명"><span class="to">귀하</span></div>
      <table class="supplier" aria-label="공급자 정보"><tbody>
        <tr><th>상 호</th><td><input data-field="business" aria-label="상호"></td><th>대표자</th><td><input data-field="owner" aria-label="대표자"></td></tr>
        <tr><th>사업자등록번호</th><td colspan="3"><input data-field="registration" aria-label="사업자등록번호"></td></tr>
        <tr><th>주 소</th><td colspan="3"><input data-field="address" aria-label="주소"></td></tr>
        <tr><th>전 화</th><td colspan="3"><input data-field="phone" aria-label="전화"></td></tr>
      </tbody></table>
    </section>
    <section class="quote-meta" aria-label="견적 정보">
      <div class="meta-item"><strong>견적일</strong><input type="date" id="quote-date" aria-label="견적일"></div>
      <div class="meta-item"><strong>견적번호</strong><input id="quote-number" aria-label="견적번호"></div>
      <div class="meta-item"><strong>유효기간</strong><input type="date" id="valid-until" aria-label="유효기간"></div>
    </section>
    <div class="amount-words" id="amount-words">일금 영원정 <span class="numeric">(₩0)</span></div>
    <table class="items" aria-label="견적 품목">
      <colgroup><col class="num"><col class="product"><col class="spec"><col class="qty"><col class="unit"><col class="total"><col class="note"><col class="actions"></colgroup>
      <thead><tr><th>번호</th><th>품목명</th><th>규격</th><th>수량</th><th>단가</th><th>금액</th><th>비고</th><th class="action-head"></th></tr></thead>
      <tbody id="items-body"></tbody>
    </table>
    <table class="totals" aria-label="합계">
      <tbody><tr><th>공급가액</th><td id="subtotal">0</td></tr><tr><th>부가세 (10%)</th><td id="tax">0</td></tr><tr><th>합계</th><td id="grand-total">0</td></tr></tbody>
    </table>
    <div class="memo"><input id="memo" aria-label="비고" placeholder="비고 또는 안내 사항"></div>
  </main>
  <script>
  (()=>{
    'use strict';
    const STORAGE_KEY='simple-quote-v1';
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const datePlus=(iso,days)=>{const d=new Date(`${iso}T12:00:00`);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const money=n=>Math.max(0,Math.floor(Number(n)||0)).toLocaleString('en-US');
    const parseNumber=value=>{const cleaned=String(value??'').replace(/,/g,'').trim();const n=Number(cleaned);return Number.isFinite(n)&&n>0?Math.floor(n):0};
    const koreanNumber=n=>{
      n=Math.max(0,Math.floor(Number(n)||0));if(n===0)return '영';
      const digits=['','일','이','삼','사','오','육','칠','팔','구'];
      const small=['','십','백','천'];const big=['','만','억','조','경'];let out='',group=0;
      while(n>0&&group<big.length){const part=n%10000;let chunk='';for(let pos=0;pos<4;pos++){const digit=Math.floor(part/10**pos)%10;if(digit)chunk=digits[digit]+small[pos]+chunk;}
        if(chunk)out=chunk+big[group]+out;n=Math.floor(n/10000);group++;}
      return out||'영';
    };
    const els={body:document.querySelector('#items-body'),customer:document.querySelector('#customer'),date:document.querySelector('#quote-date'),number:document.querySelector('#quote-number'),valid:document.querySelector('#valid-until'),memo:document.querySelector('#memo')};
    let state;
    const fresh=()=>{const date=today();return {customer:'샘플상사 김민수',supplier:{business:'예시오피스',owner:'',registration:'',address:'',phone:''},date,number:nextNumber(date),valid:datePlus(date,30),memo:'',items:[
      {name:'노트북 거치대',spec:'알루미늄',qty:'3',unit:'45,000',note:''},
      {name:'무선 키보드',spec:'한글 각인',qty:'5',unit:'32,900',note:''},
      {name:'설치 출장비',spec:'서울',qty:'1',unit:'150,000',note:''}
    ]}};
    function nextNumber(date){const key=`simple-quote-seq-${date.replaceAll('-','')}`;let n=0;try{n=Number(localStorage.getItem(key))||0;localStorage.setItem(key,String(n+1));}catch{}return `Q-${date.replaceAll('-','')}-${String(n+1).padStart(2,'0')}`;}
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{}}
    function row(item,index){const tr=document.createElement('tr');tr.innerHTML=`<td class="row-no"></td><td class="name"><input data-key="name" aria-label="품목명"></td><td><input data-key="spec" aria-label="규격"></td><td><input data-key="qty" inputmode="decimal" aria-label="수량"></td><td><input data-key="unit" inputmode="decimal" aria-label="단가"></td><td class="amount" aria-label="금액"></td><td><input data-key="note" aria-label="비고"></td><td class="action-cell"><button class="row-delete" type="button" aria-label="품목 삭제">✕</button></td>`;
      tr.querySelectorAll('input').forEach(input=>{const key=input.dataset.key;input.value=item[key]??'';input.addEventListener('input',()=>{state.items[index][key]=input.value;if(key==='qty'||key==='unit')recalculate();save();});input.addEventListener('blur',()=>{if(key==='qty'||key==='unit'){input.value=money(parseNumber(input.value));state.items[index][key]=input.value;recalculate();save();}});});
      tr.querySelector('.row-delete').addEventListener('click',()=>{state.items.splice(index,1);renderItems();recalculate();save();});return tr;
    }
    function renderItems(){els.body.replaceChildren(...state.items.map(row));els.body.querySelectorAll('.row-no').forEach((cell,i)=>cell.textContent=String(i+1));}
    function recalculate(){const subtotal=state.items.reduce((sum,item)=>sum+parseNumber(item.qty)*parseNumber(item.unit),0);const tax=Math.floor(subtotal/10);const total=subtotal+tax;
      els.body.querySelectorAll('tr').forEach((tr,i)=>{const item=state.items[i];tr.querySelector('.amount').textContent=money(parseNumber(item.qty)*parseNumber(item.unit));});
      document.querySelector('#subtotal').textContent=money(subtotal);document.querySelector('#tax').textContent=money(tax);document.querySelector('#grand-total').textContent=money(total);document.querySelector('#amount-words').innerHTML=`일금 ${koreanNumber(total)}원정 <span class="numeric">(₩${money(total)})</span>`;
    }
    function render(){els.customer.value=state.customer||'';els.date.value=state.date||today();els.number.value=state.number||'';els.valid.value=state.valid||datePlus(els.date.value,30);els.memo.value=state.memo||'';
      document.querySelectorAll('[data-field]').forEach(input=>input.value=state.supplier?.[input.dataset.field]||'');renderItems();recalculate();}
    document.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('input',()=>{state.supplier[input.dataset.field]=input.value;save();}));
    els.customer.addEventListener('input',()=>{state.customer=els.customer.value;save();});
    els.date.addEventListener('change',()=>{state.date=els.date.value;if(state.date){state.valid=datePlus(state.date,30);state.number=nextNumber(state.date);render();}save();});
    els.valid.addEventListener('change',()=>{state.valid=els.valid.value;save();});els.number.addEventListener('input',()=>{state.number=els.number.value;save();});els.memo.addEventListener('input',()=>{state.memo=els.memo.value;save();});
    document.querySelector('#add-item').addEventListener('click',()=>{if(state.items.length>=10){alert('품목은 최대 10줄까지 추가할 수 있습니다.');return;}state.items.push({name:'',spec:'',qty:'1',unit:'0',note:''});renderItems();recalculate();save();els.body.lastElementChild.querySelector('[data-key="name"]').focus();});
    document.querySelector('#print').addEventListener('click',()=>window.print());
    document.querySelector('#new-quote').addEventListener('click',()=>{if(!confirm('현재 견적 내용을 지우고 새 견적서를 만들까요?'))return;const date=today();state={...state,date,number:nextNumber(date),valid:datePlus(date,30),items:[]};render();save();});
    try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));state=saved&&typeof saved==='object'?saved:fresh();if(!Array.isArray(state.items))state=fresh();}catch{state=fresh();}
    render();
  })();
  </script>
</body>
</html>
