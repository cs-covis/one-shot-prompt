<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>견적서 · 예시오피스</title>
<style>
:root{--ink:#202734;--muted:#667085;--line:#d9dee7;--blue:#3268c5;--paper:#fff;--bg:#eef1f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}.workspace{max-width:1240px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,820px) 260px;gap:22px;align-items:start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button{border:1px solid #cbd3df;border-radius:7px;background:#fff;padding:9px 14px;font-size:13px;font-weight:700;color:#334155;cursor:pointer}.toolbar button.primary{background:var(--blue);border-color:var(--blue);color:white}.toolbar button:hover{filter:brightness(.97)}.paper{width:100%;min-height:1120px;background:var(--paper);box-shadow:0 5px 22px #18253b1b;padding:44px 48px 40px;position:relative}.doc-title{text-align:center;font-size:31px;letter-spacing:9px;margin:2px 0 25px;font-weight:800}.topmeta{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:19px}.receiver{width:48%;padding-top:14px}.receiver .label{font-size:13px;color:#596579;margin-bottom:8px}.recipient-name{font-size:21px;font-weight:700;min-width:210px}.recipient-suffix{font-size:18px;margin-left:4px}.supplier{width:48%;border-collapse:collapse;font-size:12px}.supplier th,.supplier td{border:1px solid #aab3c1;padding:6px 7px;height:31px}.supplier th{width:78px;background:#f5f7fa;font-weight:700;text-align:center;white-space:nowrap}.supplier td{width:auto}.doc-info{display:flex;gap:18px;align-items:center;border-top:1px solid #ccd3dd;border-bottom:1px solid #ccd3dd;padding:9px 0;margin:0 0 12px;font-size:12px}.doc-info label{color:#626d7e;white-space:nowrap}.doc-info .field{min-width:105px}.doc-info .valid-wrap{margin-left:auto}.amount-korean{font-size:18px;font-weight:800;letter-spacing:.3px;margin:11px 0 12px}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.items th,.items td{border:1px solid #9da8b7;padding:5px 4px;height:31px}.items th{background:#f1f4f8;text-align:center;font-weight:700}.items td{vertical-align:middle}.items .num{width:32px;text-align:center}.items .name{width:25%}.items .spec{width:17%}.items .qty{width:58px}.items .price{width:94px}.items .amount{width:100px}.items .note{width:auto}.items .delete-col{width:23px}.items td input{width:100%;min-width:0;border:0;background:transparent;padding:4px 2px;color:inherit;font:inherit;text-align:inherit;outline:0}.items td input:focus,.items td input:hover{background:#edf4ff;border-radius:3px}.items td.name-cell input,.items td.spec-cell input,.items td.note-cell input{text-align:left}.items td.num{text-align:center}.items td.number-cell input{text-align:right}.items td.amount-cell{text-align:right;padding-right:7px;color:#354154;white-space:nowrap}.delete-row{border:0;background:transparent;color:#a2aab7;cursor:pointer;font-size:13px;padding:2px}.delete-row:hover{color:#d14242}.amount-summary{width:280px;margin:14px 0 0 auto;border-collapse:collapse;font-size:12px}.amount-summary td{padding:6px 8px;border-bottom:1px solid #d9dee7}.amount-summary td:last-child{text-align:right;font-weight:700}.amount-summary tr:last-child{font-size:15px;font-weight:800;border-top:1px solid #8e99a8}.signoff{display:flex;justify-content:flex-end;margin-top:28px;font-size:13px;color:#526071}.saved-panel{background:white;padding:16px 13px;border-radius:10px;box-shadow:0 3px 16px #18253b12;position:sticky;top:16px}.saved-panel h2{margin:1px 0 12px;font-size:15px}.saved-list{display:flex;flex-direction:column;gap:7px;max-height:78vh;overflow:auto}.saved-item{border:1px solid #e0e5ec;border-radius:7px;padding:9px;cursor:pointer}.saved-item:hover{border-color:#9cb7e7;background:#f8faff}.saved-id{font-size:11px;font-weight:800}.saved-client{font-size:12px;margin:5px 0}.saved-bottom{display:flex;justify-content:space-between;color:#687386;font-size:10px}.saved-total{color:#263449;font-weight:700}.empty{color:#8992a0;font-size:12px;padding:12px 2px}.field{border:0;background:transparent;color:inherit;font:inherit;padding:2px 3px;outline:0;border-radius:3px}.field:hover,.field:focus{background:#edf4ff}.field[contenteditable="true"]:empty:before{content:attr(data-placeholder);color:#9aa3af}.supplier td .field{width:100%;display:block;min-height:18px}.supplier td .field:focus,.supplier td .field:hover{background:#edf4ff}.hidden{display:none!important}
@media(max-width:980px){.workspace{grid-template-columns:1fr;max-width:850px}.saved-panel{position:static;grid-row:2}.saved-list{max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.paper{padding:35px 38px}}
@media(max-width:560px){.workspace{padding:0 8px;margin:10px auto}.paper{padding:24px 16px;min-height:auto}.topmeta{gap:8px}.supplier{font-size:10px}.supplier th,.supplier td{padding:4px 3px}.supplier th{width:63px}.recipient-name{font-size:17px}.recipient-suffix{font-size:15px}.doc-info{gap:7px;flex-wrap:wrap}.doc-info .valid-wrap{margin-left:0}.items{font-size:9px}.items th,.items td{padding:3px 2px;height:29px}.items .name{width:23%}.items .spec{width:15%}.items .qty{width:40px}.items .price{width:69px}.items .amount{width:73px}.items .delete-col{width:18px}.amount-korean{font-size:15px}.items td input{padding:3px 1px}}
@page{size:A4 portrait;margin:10mm} @media print{html,body{background:#fff!important;width:190mm;height:277mm}.workspace{display:block;width:190mm;max-width:none;margin:0;padding:0}.editor{width:190mm;height:277mm}.toolbar,.saved-panel,.delete-col,.delete-row{display:none!important}.paper{width:190mm;height:277mm;min-height:0;box-shadow:none;padding:7mm 8mm 5mm;overflow:hidden}.doc-title{font-size:24px;margin:0 0 16px}.topmeta{margin-bottom:10px}.recipient-name{font-size:17px}.supplier th,.supplier td{height:25px;padding:4px}.doc-info{padding:6px 0;margin-bottom:7px}.amount-korean{font-size:15px;margin:7px 0}.items th,.items td{height:25px;padding:3px 3px}.items{font-size:9px}.amount-summary{margin-top:9px}.signoff{margin-top:16px}.field,.items input{background:transparent!important;padding:0!important}.items td input{font-size:9px}}
</style>
</head>
<body><main class="workspace"><section class="editor"><nav class="toolbar"><button id="addBtn">품목 추가</button><button id="viewBtn">거래명세서로 보기</button><button id="saveBtn" class="primary">저장</button><button id="newBtn">새 견적서</button><button id="printBtn">인쇄</button></nav><article class="paper" id="paper">
<h1 class="doc-title" id="title">견 적 서</h1><div class="topmeta"><div class="receiver"><div class="label" id="recipientLabel">받는 곳</div><span class="field recipient-name" id="client" contenteditable="true" data-placeholder="회사명"></span><span class="recipient-suffix" id="recipientSuffix">귀하</span></div><table class="supplier"><tbody><tr><th>상 호</th><td><span class="field" contenteditable="true" data-key="supplierName" data-placeholder="공급자 상호"></span></td><th>대표자</th><td><span class="field" contenteditable="true" data-key="representative" data-placeholder=""></span></td></tr><tr><th>사업자등록번호</th><td colspan="3"><span class="field" contenteditable="true" data-key="businessNo"></span></td></tr><tr><th>주 소</th><td colspan="3"><span class="field" contenteditable="true" data-key="address"></span></td></tr><tr><th>전 화</th><td colspan="3"><span class="field" contenteditable="true" data-key="phone"></span></td></tr></tbody></table></div>
<div class="doc-info"><label id="dateLabel">견적일</label><span class="field" id="quoteDate" contenteditable="true"></span><label>견적번호</label><span class="field" id="quoteId" contenteditable="true"></span><span class="valid-wrap" id="validWrap"><label>유효기간</label> <span class="field" id="validDate" contenteditable="true"></span></span></div><div class="amount-korean" id="koreanAmount"></div>
<table class="items" id="items"><thead><tr><th class="num">번호</th><th class="name">품목명</th><th class="spec">규격</th><th class="qty">수량</th><th class="price">단가</th><th class="amount">금액</th><th class="note">비고</th><th class="delete-col"></th></tr></thead><tbody id="itemRows"></tbody></table><table class="amount-summary"><tbody><tr><td>공급가액</td><td id="subtotal">0</td></tr><tr><td>부가세 (10%)</td><td id="tax">0</td></tr><tr><td>합계</td><td id="total">0</td></tr></tbody></table><div class="signoff">위와 같이 견적합니다.</div></article></section><aside class="saved-panel"><h2>저장한 견적</h2><div class="saved-list" id="savedList"></div></aside></main>
<script>
(()=>{'use strict';const DRAFT='quote_app_draft_v1',SAVED='quote_app_saved_v1',SEQ='quote_app_seq_v1';const $=id=>document.getElementById(id),rows=$('itemRows');let state,mode='quote';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},dateCompact=d=>(d||today()).replace(/\D/g,'').slice(0,8);function saved(){try{return JSON.parse(localStorage.getItem(SAVED)||'[]')}catch{return []}}function num(v){const x=Number(String(v??'').replace(/[₩원,\s]/g,'').replace(/[^\d.\-]/g,''));return Number.isFinite(x)&&x>0?Math.floor(x):0}function fmt(n){return Math.max(0,Math.floor(n)||0).toLocaleString('ko-KR')}function amountHangul(n){if(n===0)return '영';const d=['영','일','이','삼','사','오','육','칠','팔','구'],units=['','십','백','천'],big=['','만','억','조'];let chunks=[],i=0;while(n>0&&i<big.length){const part=n%10000;if(part){let s='';for(let p=3;p>=0;p--){const z=Math.floor(part/10**p)%10;if(z)s+=d[z]+units[p]}if(i>0&&part===1)s='';chunks.unshift(s+big[i])}n=Math.floor(n/10000);i++}return chunks.join('')||'영'}function nextId(){const day=dateCompact(today()),all=saved(),stored=JSON.parse(localStorage.getItem(SEQ)||'{}'),max=all.reduce((m,q)=>q.id?.startsWith('Q-'+day+'-')?Math.max(m,Number(q.id.slice(-2))||0):m,0);let n=Math.max(max,stored[day]||0)+1;stored[day]=n;localStorage.setItem(SEQ,JSON.stringify(stored));return `Q-${day}-${String(n).padStart(2,'0')}`}function blank(){const date=today();return {client:'',supplier:{supplierName:'',representative:'',businessNo:'',address:'',phone:''},date,id:nextId(),valid:addDays(date,30),items:[]}}function addDays(iso,n){let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function sample(){let q=blank();q.client='샘플상사 김민수';q.supplier.supplierName='예시오피스';q.items=[{name:'노트북 거치대',spec:'알루미늄',qty:'3',price:'45000',note:''},{name:'무선 키보드',spec:'한글 각인',qty:'5',price:'32900',note:''},{name:'설치 출장비',spec:'서울',qty:'1',price:'150000',note:''}];return q}function normalize(q){return {client:q.client||'',supplier:{supplierName:'',representative:'',businessNo:'',address:'',phone:'',...(q.supplier||{})},date:q.date||today(),id:q.id||nextId(),valid:q.valid||addDays(q.date||today(),30),items:Array.isArray(q.items)?q.items.map(x=>({name:x.name||'',spec:x.spec||'',qty:String(x.qty??''),price:String(x.price??''),note:x.note||''})):[]}}function persist(){localStorage.setItem(DRAFT,JSON.stringify(state))}function loadDraft(){try{const v=localStorage.getItem(DRAFT);return v?normalize(JSON.parse(v)):sample()}catch{return sample()}}function render(){ $('client').textContent=state.client;$('quoteDate').textContent=state.date;$('quoteId').textContent=state.id;$('validDate').textContent=state.valid;document.querySelectorAll('[data-key]').forEach(e=>e.textContent=state.supplier[e.dataset.key]||'');rows.innerHTML='';state.items.forEach((it,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="num">${i+1}</td><td class="name-cell"><input aria-label="품목명" data-field="name"></td><td class="spec-cell"><input aria-label="규격" data-field="spec"></td><td class="number-cell"><input aria-label="수량" data-field="qty" inputmode="decimal"></td><td class="number-cell"><input aria-label="단가" data-field="price" inputmode="decimal"></td><td class="amount-cell" aria-label="금액"></td><td class="note-cell"><input aria-label="비고" data-field="note"></td><td class="delete-col"><button class="delete-row" title="행 삭제" aria-label="행 삭제">✕</button></td>`;tr.querySelectorAll('input').forEach(inp=>{let f=inp.dataset.field;inp.value=it[f];inp.addEventListener('input',()=>{it[f]=inp.value;if(f==='qty'||f==='price')calc();persist()});});tr.querySelector('.delete-row').onclick=()=>{state.items.splice(i,1);render();persist()};rows.appendChild(tr)});calc();$('savedList').innerHTML='';let list=saved().sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));if(!list.length)$('savedList').innerHTML='<div class="empty">저장한 견적이 없습니다.</div>';list.forEach(q=>{let t=(q.items||[]).reduce((s,x)=>s+num(x.qty)*num(x.price),0),el=document.createElement('div');el.className='saved-item';el.innerHTML=`<div class="saved-id"></div><div class="saved-client"></div><div class="saved-bottom"><span class="saved-total"></span><span class="saved-date"></span></div>`;el.querySelector('.saved-id').textContent=q.id;el.querySelector('.saved-client').textContent=q.client||'받는 곳 미입력';el.querySelector('.saved-total').textContent='₩'+fmt(t+Math.floor(t*.1));el.querySelector('.saved-date').textContent=q.date||'';el.onclick=()=>{state=normalize(q);mode='quote';render();persist()};$('savedList').appendChild(el)})}function calc(){let sub=state.items.reduce((s,x)=>s+num(x.qty)*num(x.price),0),tax=Math.floor(sub/10),total=sub+tax;[...rows.querySelectorAll('tr')].forEach((tr,i)=>{let x=state.items[i];tr.querySelector('.amount-cell').textContent=fmt(num(x.qty)*num(x.price))});$('subtotal').textContent=fmt(sub);$('tax').textContent=fmt(tax);$('total').textContent=fmt(total);$('koreanAmount').textContent=`일금 ${amountHangul(total)}원정 (₩${fmt(total)})`}
function addRow(data={}){state.items.push({name:data.name||'',spec:data.spec||'',qty:data.qty??'',price:data.price??'',note:data.note||''});render();persist()}function store(){let list=saved(),copy=JSON.parse(JSON.stringify(state));copy.updated=new Date().toISOString();const i=list.findIndex(q=>q.id===copy.id);if(i>=0)list[i]=copy;else list.unshift(copy);localStorage.setItem(SAVED,JSON.stringify(list));persist();render()}function pasted(e){const text=e.clipboardData?.getData('text/plain');if(!text)return;const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');if(!lines.length)return;const matrix=lines.map(x=>x.split('\t'));if(matrix.length>1||matrix.some(x=>x.length>1)){e.preventDefault();matrix.forEach(c=>{const [name='',spec='',qty='',price='',note='']=c;state.items.push({name,spec,qty:qty.replace(/[₩원,\s]/g,''),price:price.replace(/[₩원,\s]/g,''),note})});render();persist()}}
document.addEventListener('paste',e=>{if(e.target.closest('#items'))pasted(e)});$('addBtn').onclick=()=>addRow();$('saveBtn').onclick=store;$('newBtn').onclick=()=>{store();state=blank();mode='quote';render();persist()};$('printBtn').onclick=()=>window.print();$('viewBtn').onclick=()=>{mode=mode==='quote'?'statement':'quote';$('title').textContent=mode==='quote'?'견 적 서':'거 래 명 세 서';$('recipientLabel').textContent=mode==='quote'?'받는 곳':'공급받는자';$('recipientSuffix').classList.toggle('hidden',mode==='statement');$('dateLabel').textContent=mode==='quote'?'견적일':'거래일자';$('validWrap').classList.toggle('hidden',mode==='statement');$('viewBtn').textContent=mode==='quote'?'거래명세서로 보기':'견적서로 보기'};$('client').addEventListener('input',()=>{state.client=$('client').textContent;persist()});$('quoteDate').addEventListener('input',()=>{state.date=$('quoteDate').textContent;persist()});$('quoteId').addEventListener('input',()=>{state.id=$('quoteId').textContent;persist()});$('validDate').addEventListener('input',()=>{state.valid=$('validDate').textContent;persist()});document.querySelectorAll('[data-key]').forEach(e=>e.addEventListener('input',()=>{state.supplier[e.dataset.key]=e.textContent;persist()}));state=loadDraft();render();if(!state.items.length)state.items=[];})();
</script></body></html>
