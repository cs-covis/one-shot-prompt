<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>견적서</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#d7dbe1;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#111;font-size:13px}

/* 화면 전용 버튼 줄 */
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;justify-content:center;padding:12px;background:#3b4350;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toolbar button{font:inherit;font-size:14px;padding:8px 18px;border:0;border-radius:4px;background:#fff;color:#222;cursor:pointer}
.toolbar button:hover{background:#e3ecfb}

/* A4 종이 */
.paper{width:210mm;min-height:297mm;margin:28px auto 60px;padding:18mm 16mm;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.25)}

/* 편집 가능한 글자: 테두리 없이 인쇄된 글자처럼, 마우스를 올리거나 누르면 옅은 강조 */
.ed{display:inline-block;min-width:1em;padding:1px 3px;border-radius:2px;outline:none;cursor:text;transition:background-color .12s;white-space:pre-wrap;word-break:break-word}
.ed.blk{display:block;min-height:1.6em;padding:3px 5px}
.ed:hover{background:#eef4fc}
.ed:focus{background:#e2ecfa}
.ed:empty::before{content:attr(data-ph);color:#b8bec8}

.title{text-align:center;font-size:34px;letter-spacing:.1em;margin:0 0 18px;font-weight:700}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;margin-bottom:14px}
.meta b{font-weight:600}

.parties{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}
.recv{width:44%;padding-top:20px}
.rc-co .ed{font-size:20px;font-weight:700}
.rc-name{margin-top:6px;font-size:15px}

.supplier{width:54%;border-collapse:collapse;font-size:12px}
.supplier th{width:30%;background:#f2f2f2;border:1px solid #444;padding:4px 6px;text-align:center;font-weight:600}
.supplier td{border:1px solid #444;padding:0}

.kr-total{font-size:19px;font-weight:700;border-top:2px solid #111;border-bottom:2px solid #111;padding:8px 6px;margin-bottom:10px}

.items,.sum{width:100%;border-collapse:collapse;font-size:12.5px}
.items th,.items td{border:1px solid #444;padding:0}
.items th{background:#f2f2f2;padding:5px 4px;font-weight:600;text-align:center}
.items td.c-no{text-align:center;padding:4px}
.items td.c-r .ed{text-align:right}
.items td.amt{text-align:right;padding:4px 6px;white-space:nowrap}
.items td.c-x{text-align:center;width:28px}
.del{border:0;background:none;color:#999;cursor:pointer;font-size:14px;padding:2px 6px}
.del:hover{color:#c00}

.sum{margin-top:10px;width:46%;margin-left:auto}
.sum th,.sum td{border:1px solid #444;padding:5px 8px;font-size:13px}
.sum th{background:#f2f2f2;text-align:center;width:40%;font-weight:600}
.sum td{text-align:right}
.sum .grand th,.sum .grand td{font-weight:700;font-size:15px}

/* 인쇄: A4 세로, 버튼과 강조 제거 */
@page{size:A4 portrait;margin:12mm}
@media print{
  html,body{background:#fff}
  .no-print{display:none!important}
  .paper{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .ed:hover,.ed:focus{background:transparent!important}
  .ed:empty::before{content:none!important}
  .items th,.items td,.sum th,.sum td,.supplier th,.supplier td,.items th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .items tr,.sum,.supplier,.kr-total{break-inside:avoid}
}
</style>
</head>
<body>

<div class="toolbar no-print">
  <button id="btn-add" type="button">품목 추가</button>
  <button id="btn-print" type="button">인쇄</button>
  <button id="btn-new" type="button">새 견적서</button>
</div>

<main class="paper" id="paper"></main>

<script>
// ==LOGIC==  (화면과 무관한 계산 함수: 순수 함수)
const DIG = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
const UNIT = ['', '십', '백', '천'];
const BIG = ['', '만', '억', '조'];

// 숫자를 한글로. 1 은 십·백·천 앞에서도 '일'로 적는다 (1,110 → 일천일백일십)
function toKorean(n) {
  if (n === 0) return '영';
  let out = '';
  for (let k = 0; n > 0; k++) {
    const g = n % 10000;          // 만 단위 묶음 (4자리)
    n = Math.floor(n / 10000);
    if (g === 0) continue;
    let s = '';
    for (let p = 3; p >= 0; p--) {
      const d = Math.floor(g / 10 ** p) % 10;
      if (d) s += DIG[d] + UNIT[p];
    }
    out = s + (BIG[k] || '') + out;
  }
  return out;
}

// 입력값 → 0 이상의 숫자. 숫자가 아니거나 음수면 0
function parseNum(raw) {
  const s = String(raw == null ? '' : raw).replace(/,/g, '').trim();
  return /^\d+(\.\d*)?$/.test(s) ? Number(s) : 0;
}

function fmtNum(n) {
  return Number(n).toLocaleString('en-US', { maximumFractionDigits: 6 });
}

function lineAmount(it) {
  return Math.floor(Math.round(it.qty * it.price * 1e6) / 1e6);
}

function calc(items) {
  const amounts = items.map(lineAmount);
  const supply = amounts.reduce((a, b) => a + b, 0);
  const vat = Math.floor(supply / 10);       // 원 미만 버림
  return { amounts, supply, vat, total: supply + vat };
}

function krAmount(total) {
  return '일금 ' + toKorean(total) + '원정 (₩' + fmtNum(total) + ')';
}

function pad2(n) { return String(n).padStart(2, '0'); }
function todayKey() {
  const d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());   // 20261117
}
function parseKey(k) { return new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8)); }
function krDate(d) { return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
function validUntilText(key, days) {
  const d = parseKey(key);
  d.setDate(d.getDate() + days);
  return krDate(d);
}
// 날짜별 일련번호: 같은 날이면 +1, 다른 날이면 01부터
function nextQuoteNo(counter, key) {
  const c = counter && counter.date === key ? { date: key, n: counter.n + 1 } : { date: key, n: 1 };
  return { counter: c, no: 'Q-' + key + '-' + pad2(c.n) };
}
// ==/LOGIC==

const KEY = 'toy-quote-v1';
const paper = document.getElementById('paper');
let state;

function freshState() {
  return {
    quoteDate: '',
    quoteNo: '',
    counter: { date: '', n: 0 },
    validDays: 30,
    recipient: { company: '샘플상사', contact: '김민수' },
    supplier: { name: '예시오피스', rep: '', biz: '', addr: '', tel: '' },
    items: [
      { name: '노트북 거치대', spec: '알루미늄', qty: 3, price: 45000, note: '' },
      { name: '무선 키보드', spec: '한글 각인', qty: 5, price: 32900, note: '' },
      { name: '설치 출장비', spec: '서울', qty: 1, price: 150000, note: '' }
    ]
  };
}

function newNumber() {
  const key = todayKey();
  const r = nextQuoteNo(state.counter, key);
  state.counter = r.counter;
  state.quoteNo = r.no;
  state.quoteDate = key;
}

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) { saved = null; }
  state = Object.assign(freshState(), saved && typeof saved === 'object' ? saved : {});
  if (!Array.isArray(state.items)) state.items = [];
  if (state.quoteDate !== todayKey() || !state.quoteNo) newNumber();
  save();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경이면 그냥 넘어감 */ }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function cell(attr, value, ph, cls) {
  return '<span class="ed ' + (cls || '') + '" contenteditable="true" spellcheck="false" data-ph="' + esc(ph) + '" ' + attr + '>' + esc(value) + '</span>';
}

function renderAll() {
  const r = state.recipient, s = state.supplier;
  const rows = state.items.map((it, i) => `
    <tr>
      <td class="c-no">${i + 1}</td>
      <td>${cell('data-f="name" data-i="' + i + '"', it.name, '품목명', 'blk')}</td>
      <td>${cell('data-f="spec" data-i="' + i + '"', it.spec, '규격', 'blk')}</td>
      <td class="c-r">${cell('data-f="qty" data-i="' + i + '"', fmtNum(it.qty), '0', 'blk')}</td>
      <td class="c-r">${cell('data-f="price" data-i="' + i + '"', fmtNum(it.price), '0', 'blk')}</td>
      <td class="amt" data-amt="${i}"></td>
      <td>${cell('data-f="note" data-i="' + i + '"', it.note, '', 'blk')}</td>
      <td class="no-print c-x"><button type="button" class="del" data-del="${i}" title="이 줄 지우기">✕</button></td>
    </tr>`).join('');

  paper.innerHTML = `
    <h1 class="title">견 적 서</h1>
    <div class="meta">
      <span>견적번호 <b>${esc(state.quoteNo)}</b></span>
      <span>견적일 <b>${krDate(parseKey(state.quoteDate))}</b></span>
      <span>유효기간 ${cell('data-days', String(state.validDays), '30', 'inline')}일 <span id="valid-until"></span></span>
    </div>
    <section class="parties">
      <div class="recv">
        <div class="rc-co">${cell('data-r="company"', r.company, '회사명', 'inline')}</div>
        <div class="rc-name">${cell('data-r="contact"', r.contact, '담당자', 'inline')} 귀하</div>
      </div>
      <table class="supplier">
        <tr><th>상호</th><td>${cell('data-s="name"', s.name, '상호', 'blk')}</td></tr>
        <tr><th>대표자</th><td>${cell('data-s="rep"', s.rep, '대표자', 'blk')}</td></tr>
        <tr><th>사업자등록번호</th><td>${cell('data-s="biz"', s.biz, '등록번호', 'blk')}</td></tr>
        <tr><th>주소</th><td>${cell('data-s="addr"', s.addr, '주소', 'blk')}</td></tr>
        <tr><th>전화</th><td>${cell('data-s="tel"', s.tel, '전화', 'blk')}</td></tr>
      </table>
    </section>
    <div class="kr-total" id="kr-total"></div>
    <table class="items">
      <thead>
        <tr>
          <th style="width:7%">번호</th>
          <th style="width:24%">품목명</th>
          <th style="width:14%">규격</th>
          <th style="width:9%">수량</th>
          <th style="width:13%">단가</th>
          <th style="width:14%">금액</th>
          <th style="width:13%">비고</th>
          <th class="no-print" style="width:28px"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <table class="sum">
      <tr><th>공급가액</th><td id="sum-supply"></td></tr>
      <tr><th>부가세 (10%)</th><td id="sum-vat"></td></tr>
      <tr class="grand"><th>합계</th><td id="sum-total"></td></tr>
    </table>`;
  updateTotals();
}

function updateTotals() {
  const c = calc(state.items);
  state.items.forEach((_, i) => {
    const el = paper.querySelector('[data-amt="' + i + '"]');
    if (el) el.textContent = fmtNum(c.amounts[i]);
  });
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('sum-supply', fmtNum(c.supply));
  set('sum-vat', fmtNum(c.vat));
  set('sum-total', fmtNum(c.total));
  set('kr-total', krAmount(c.total));
  set('valid-until', '(' + validUntilText(state.quoteDate, Math.max(0, Math.floor(state.validDays))) + '까지)');
}

// 입력 → 상태 저장 → 계산 갱신
paper.addEventListener('input', e => {
  const el = e.target.closest ? e.target.closest('.ed') : null;
  if (!el) return;
  if (el.innerHTML === '<br>') el.innerHTML = '';
  const d = el.dataset;
  if (d.i !== undefined) {
    const it = state.items[+d.i];
    if (!it) return;
    it[d.f] = (d.f === 'qty' || d.f === 'price') ? parseNum(el.textContent) : el.textContent;
  } else if (d.r !== undefined) {
    state.recipient[d.r] = el.textContent;
  } else if (d.s !== undefined) {
    state.supplier[d.s] = el.textContent;
  } else if (d.days !== undefined) {
    state.validDays = Math.floor(parseNum(el.textContent));
  }
  save();
  updateTotals();
});

// 나갈 때 숫자 칸을 정돈된 모양(천 단위 쉼표)으로
paper.addEventListener('focusout', e => {
  const el = e.target.closest ? e.target.closest('.ed') : null;
  if (!el) return;
  const d = el.dataset;
  if (d.i !== undefined && (d.f === 'qty' || d.f === 'price')) {
    el.textContent = fmtNum(state.items[+d.i][d.f]);
  } else if (d.days !== undefined) {
    el.textContent = String(state.validDays);
  }
});

// Enter 는 줄바꿈 대신 입력 끝냄
paper.addEventListener('keydown', e => {
  const el = e.target.closest ? e.target.closest('.ed') : null;
  if (el && e.key === 'Enter') { e.preventDefault(); el.blur(); }
});

// 붙여넣기는 글자만
paper.addEventListener('paste', e => {
  const el = e.target.closest ? e.target.closest('.ed') : null;
  if (!el) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g, ' ').trim();
  document.execCommand('insertText', false, text);
});

// 줄 지우기 ✕
paper.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-del]') : null;
  if (!b) return;
  state.items.splice(+b.dataset.del, 1);
  save();
  renderAll();
});

document.getElementById('btn-add').onclick = () => {
  state.items.push({ name: '', spec: '', qty: 0, price: 0, note: '' });
  save();
  renderAll();
  const el = paper.querySelector('[data-f="name"][data-i="' + (state.items.length - 1) + '"]');
  if (el) el.focus();
};

document.getElementById('btn-print').onclick = () => {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  window.print();
};

document.getElementById('btn-new').onclick = () => {
  if (!confirm('새 견적서를 시작할까요?\n품목은 모두 비워지고 새 견적번호가 매겨집니다.')) return;
  state.items = [];
  newNumber();
  save();
  renderAll();
};

load();
renderAll();
</script>
</body>
</html>
