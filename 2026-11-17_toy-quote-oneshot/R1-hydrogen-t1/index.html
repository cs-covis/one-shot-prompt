<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>견적서</title>
  <style>
    :root {
      --bg-desk: #eef0f4;
      --paper-bg: #ffffff;
      --ink: #1a1d21;
      --ink-muted: #555b66;
      --line: #22262c;
      --line-light: #cfd5de;
      --hover-bg: rgba(37, 99, 235, 0.06);
      --focus-bg: rgba(37, 99, 235, 0.11);
      --focus-line: rgba(37, 99, 235, 0.55);
      --accent: #2563eb;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-desk);
      color: var(--ink);
      font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      min-height: 100vh;
    }

    /* 상단 종이 밖 버튼 바 */
    .toolbar {
      width: 210mm;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .save-status {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2d333b;
      border-color: #2d333b;
    }

    /* A4 세로 종이 */
    .paper {
      width: 210mm;
      min-height: 297mm;
      background: var(--paper-bg);
      padding: 15mm 14mm;
      box-shadow: 0 6px 28px rgba(15, 23, 42, 0.10), 0 1px 4px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
    }

    /* 인쇄된 글자처럼 보이는 입력 칸 */
    .field {
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 2px 4px;
      margin: -2px -4px;
      border-radius: 3px;
      outline: none;
      width: 100%;
      transition: background 0.12s ease, box-shadow 0.12s ease;
    }

    .field:hover {
      background: var(--hover-bg);
    }

    .field:focus {
      background: var(--focus-bg);
      box-shadow: inset 0 -1.5px 0 var(--focus-line);
    }

    .field::placeholder {
      color: #b0b7c3;
    }

    .field-inline {
      width: auto;
      display: inline-block;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    /* 제목 */
    .doc-title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.45em;
      padding-left: 0.45em;
      margin: 0 0 18px;
      padding-bottom: 10px;
      border-bottom: 2.5px solid var(--line);
    }

    /* 상단 2단 (받는 곳 + 견적 정보 / 공급자 표) */
    .header-grid {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 20px;
      margin-bottom: 14px;
      align-items: start;
    }

    .recipient-block {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .recipient-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--line);
      margin-bottom: 6px;
    }

    .recipient-company {
      flex: 1 1 auto;
      min-width: 80px;
      font-weight: 700;
      font-size: 16px;
    }

    .recipient-person {
      width: 86px;
      flex: 0 0 auto;
      font-weight: 700;
      font-size: 16px;
      text-align: right;
    }

    .recipient-honorific {
      flex: 0 0 auto;
      font-size: 14px;
      font-weight: 600;
    }

    .greeting {
      font-size: 12px;
      color: var(--ink-muted);
      margin: 0 0 12px;
    }

    .meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .meta-table th {
      text-align: left;
      font-weight: 600;
      color: var(--ink-muted);
      width: 72px;
      padding: 3px 6px 3px 0;
    }

    .meta-table td {
      padding: 3px 0;
    }

    .meta-table input[type="date"] {
      font-variant-numeric: tabular-nums;
    }

    /* 공급자 표 */
    .supplier-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      border: 1.5px solid var(--line);
    }

    .supplier-table th,
    .supplier-table td {
      border: 1px solid var(--line-light);
      padding: 4px 7px;
      vertical-align: middle;
    }

    .supplier-table .sup-side {
      width: 24px;
      text-align: center;
      font-weight: 700;
      background: #f5f7fa;
      border-right: 1px solid var(--line);
      line-height: 1.6;
      letter-spacing: 0.1em;
    }

    .supplier-table .sup-label {
      width: 88px;
      background: #f9fafb;
      font-weight: 600;
      color: var(--ink-muted);
      text-align: center;
      white-space: nowrap;
    }

    /* 한글 합계 배너 */
    .total-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-top: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      background: #f8f9fb;
      margin-bottom: 12px;
    }

    .total-banner-label {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--ink-muted);
    }

    .total-banner-value {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: right;
      word-break: keep-all;
    }

    /* 품목 표 */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12.5px;
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
    }

    .items-table th,
    .items-table td {
      border: 1px solid var(--line-light);
      padding: 4px 6px;
      vertical-align: middle;
    }

    .items-table th:first-child,
    .items-table td:first-child {
      border-left: 1px solid var(--line);
    }

    .items-table th.col-remarks,
    .items-table td.col-remarks {
      border-right: 1px solid var(--line);
    }

    .items-table thead th {
      background: #f5f7fa;
      font-weight: 700;
      text-align: center;
      padding: 6px 4px;
      border-bottom: 1.5px solid var(--line);
    }

    .col-no { width: 34px; }
    .col-name { width: auto; }
    .col-spec { width: 92px; }
    .col-qty { width: 54px; }
    .col-price { width: 88px; }
    .col-amount { width: 98px; }
    .col-remarks { width: 88px; }
    .col-action {
      width: 26px;
      border: none !important;
      background: transparent !important;
      padding: 0 0 0 4px !important;
      text-align: center;
    }

    .amount-cell {
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
      user-select: text;
    }

    .btn-del {
      appearance: none;
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 13px;
      line-height: 1;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s ease, background 0.12s ease;
    }

    .btn-del:hover {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.08);
    }

    .empty-row td {
      text-align: center;
      color: var(--ink-muted);
      padding: 18px 8px;
      border-right: 1px solid var(--line);
    }

    /* 합계 요약 */
    .summary-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .summary-table {
      width: 270px;
      border-collapse: collapse;
      font-size: 13px;
      border: 1.5px solid var(--line);
    }

    .summary-table th,
    .summary-table td {
      border: 1px solid var(--line-light);
      padding: 5px 10px;
    }

    .summary-table th {
      background: #f5f7fa;
      text-align: left;
      font-weight: 600;
      width: 110px;
    }

    .summary-table td {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .summary-table tr.grand-total th,
    .summary-table tr.grand-total td {
      background: #f1f5f9;
      border-top: 1.5px solid var(--line);
      font-size: 14px;
      font-weight: 800;
    }

    /* 하단 비고/메모 */
    .footer-note {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px dashed var(--line-light);
      font-size: 12px;
      color: var(--ink-muted);
    }

    .footer-note-input {
      width: 100%;
      resize: none;
      overflow: hidden;
      min-height: 22px;
      font-size: 12px;
      color: var(--ink);
    }

    /* 인쇄 설정: A4 세로 한 장 여백 맞춤 */
    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .app-shell {
        padding: 0 !important;
        min-height: auto !important;
        display: block !important;
      }

      .toolbar,
      .col-action {
        display: none !important;
      }

      .paper {
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
      }

      .field,
      .field:hover,
      .field:focus {
        background: transparent !important;
        box-shadow: none !important;
      }

      .field::placeholder {
        color: transparent !important;
      }

      input[type="date"]::-webkit-calendar-picker-indicator {
        display: none !important;
        -webkit-appearance: none;
      }

      .total-banner,
      .supplier-table .sup-side,
      .supplier-table .sup-label,
      .items-table thead th,
      .summary-table th,
      .summary-table tr.grand-total th,
      .summary-table tr.grand-total td {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }

    @media (max-width: 820px) {
      .paper {
        width: 100%;
        min-height: auto;
        padding: 18px 14px;
      }
      .header-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="toolbar">
      <div class="save-status" id="saveStatus">자동 저장됨</div>
      <div class="toolbar-actions">
        <button type="button" class="btn" id="btnAddItem">+ 품목 추가</button>
        <button type="button" class="btn btn-primary" id="btnPrint">인쇄</button>
        <button type="button" class="btn" id="btnNewQuote">새 견적서</button>
      </div>
    </div>

    <main class="paper" id="quotePaper">
      <h1 class="doc-title">견 적 서</h1>

      <section class="header-grid">
        <div class="recipient-block">
          <div>
            <div class="recipient-line">
              <input type="text" class="field recipient-company" id="recipientCompany" placeholder="회사명" aria-label="받는 회사명" />
              <input type="text" class="field recipient-person" id="recipientPerson" placeholder="담당자" aria-label="받는 담당자" />
              <span class="recipient-honorific">귀하</span>
            </div>
            <p class="greeting">아래와 같이 견적합니다.</p>
          </div>

          <table class="meta-table">
            <tr>
              <th>견적번호</th>
              <td><input type="text" class="field num" id="quoteNumber" aria-label="견적번호" /></td>
            </tr>
            <tr>
              <th>견적일</th>
              <td><input type="date" class="field num" id="quoteDate" aria-label="견적일" /></td>
            </tr>
            <tr>
              <th>유효기간</th>
              <td><input type="date" class="field num" id="validUntil" aria-label="유효기간" /></td>
            </tr>
          </table>
        </div>

        <div>
          <table class="supplier-table">
            <tr>
              <th class="sup-side" rowspan="5">공<br />급<br />자</th>
              <th class="sup-label">상호</th>
              <td><input type="text" class="field" id="supName" placeholder="상호" aria-label="공급자 상호" /></td>
            </tr>
            <tr>
              <th class="sup-label">대표자</th>
              <td><input type="text" class="field" id="supCeo" placeholder="대표자명" aria-label="공급자 대표자" /></td>
            </tr>
            <tr>
              <th class="sup-label">사업자등록번호</th>
              <td><input type="text" class="field num" id="supBizNo" placeholder="000-00-00000" aria-label="사업자등록번호" /></td>
            </tr>
            <tr>
              <th class="sup-label">주소</th>
              <td><input type="text" class="field" id="supAddress" placeholder="사업장 주소" aria-label="공급자 주소" /></td>
            </tr>
            <tr>
              <th class="sup-label">전화</th>
              <td><input type="text" class="field num" id="supPhone" placeholder="02-0000-0000" aria-label="공급자 전화" /></td>
            </tr>
          </table>
        </div>
      </section>

      <section class="total-banner" aria-label="합계 금액">
        <span class="total-banner-label">합계금액 (부가세 포함)</span>
        <span class="total-banner-value num" id="koreanTotalDisplay">일금 영원정 (₩0)</span>
      </section>

      <table class="items-table" aria-label="품목 내역">
        <thead>
          <tr>
            <th class="col-no">번호</th>
            <th class="col-name">품목명</th>
            <th class="col-spec">규격</th>
            <th class="col-qty">수량</th>
            <th class="col-price">단가</th>
            <th class="col-amount">금액</th>
            <th class="col-remarks">비고</th>
            <th class="col-action" aria-hidden="true"></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>

      <div class="summary-wrap">
        <table class="summary-table" aria-label="금액 요약">
          <tr>
            <th>공급가액</th>
            <td id="subtotalDisplay">0 원</td>
          </tr>
          <tr>
            <th>부가세(10%)</th>
            <td id="vatDisplay">0 원</td>
          </tr>
          <tr class="grand-total">
            <th>합계</th>
            <td id="grandTotalDisplay">0 원</td>
          </tr>
        </table>
      </div>

      <div class="footer-note">
        <input type="text" class="field footer-note-input" id="footerNote" placeholder="특이사항이나 계좌 안내 등을 입력하세요." aria-label="하단 비고" />
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'simple_quote_app_v1';
      const SEQ_KEY = 'simple_quote_seq_v1';

      function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function addDays(dateStr, days) {
        const parts = String(dateStr || '').split('-').map(Number);
        const base = parts.length === 3 && !parts.some(isNaN)
          ? new Date(parts[0], parts[1] - 1, parts[2])
          : new Date();
        base.setDate(base.getDate() + days);
        return formatDate(base);
      }

      function compactDate(dateStr) {
        return String(dateStr || '').replace(/-/g, '');
      }

      function nextQuoteNumber(dateStr) {
        const ymd = compactDate(dateStr) || compactDate(formatDate(new Date()));
        let seqMap = {};
        try {
          seqMap = JSON.parse(localStorage.getItem(SEQ_KEY) || '{}');
        } catch (e) {
          seqMap = {};
        }
        const nextSeq = (Number(seqMap[ymd]) || 0) + 1;
        seqMap[ymd] = nextSeq;
        try {
          localStorage.setItem(SEQ_KEY, JSON.stringify(seqMap));
        } catch (e) {
          // ignore storage quota errors
        }
        return `Q-${ymd}-${String(nextSeq).padStart(2, '0')}`;
      }

      // 숫자가 아닌 입력은 0, 음수 불가
      function sanitizeNonNegativeNumber(raw) {
        if (typeof raw === 'number') {
          if (!Number.isFinite(raw) || raw < 0) return 0;
          return Math.floor(raw);
        }
        const cleaned = String(raw == null ? '' : raw).replace(/,/g, '').trim();
        if (!cleaned) return 0;
        // 순수 양수 숫자(소수점 포함 가능)만 허용, 마이너스/문자 포함 시 0
        if (!/^\d+(\.\d+)?$/.test(cleaned)) return 0;
        const num = Number(cleaned);
        if (!Number.isFinite(num) || num < 0) return 0;
        return Math.floor(num);
      }

      function formatNumber(n) {
        const val = sanitizeNonNegativeNumber(n);
        return val.toLocaleString('ko-KR');
      }

      // 한글 금액 변환: 십·백·천 앞의 '일'을 빼지 않음
      function numberToKorean(amount) {
        const n = sanitizeNonNegativeNumber(amount);
        if (n === 0) return '영';

        const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
        const subUnits = ['', '십', '백', '천'];
        const bigUnits = ['', '만', '억', '조', '경'];

        function chunkToKorean(chunk) {
          let result = '';
          const str = String(chunk);
          const len = str.length;
          for (let i = 0; i < len; i++) {
            const d = Number(str[i]);
            if (d === 0) continue;
            const pos = len - 1 - i;
            result += digits[d] + subUnits[pos];
          }
          return result;
        }

        let remaining = n;
        let unitIdx = 0;
        const parts = [];

        while (remaining > 0) {
          const chunk = remaining % 10000;
          if (chunk > 0) {
            parts.unshift(chunkToKorean(chunk) + (bigUnits[unitIdx] || ''));
          }
          remaining = Math.floor(remaining / 10000);
          unitIdx++;
        }

        return parts.join('');
      }

      function formatKoreanTotal(amount) {
        const val = sanitizeNonNegativeNumber(amount);
        return `일금 ${numberToKorean(val)}원정 (₩${formatNumber(val)})`;
      }

      function calculateTotals(items) {
        const supplyAmount = items.reduce((sum, item) => {
          const qty = sanitizeNonNegativeNumber(item.qty);
          const price = sanitizeNonNegativeNumber(item.price);
          return sum + qty * price;
        }, 0);
        const vat = Math.floor(supplyAmount * 0.1);
        const grandTotal = supplyAmount + vat;
        return { supplyAmount, vat, grandTotal };
      }

      function createDefaultState() {
        const today = formatDate(new Date());
        const ymd = compactDate(today);
        try {
          const seqMap = JSON.parse(localStorage.getItem(SEQ_KEY) || '{}');
          if (!seqMap[ymd]) {
            seqMap[ymd] = 1;
            localStorage.setItem(SEQ_KEY, JSON.stringify(seqMap));
          }
        } catch (e) {
          // ignore
        }
        return {
          recipientCompany: '샘플상사',
          recipientPerson: '김민수',
          quoteNumber: `Q-${ymd}-01`,
          quoteDate: today,
          validUntil: addDays(today, 30),
          supplier: {
            name: '예시오피스',
            ceo: '홍길동',
            bizNo: '123-45-67890',
            address: '서울특별시 강남구 테헤란로 123',
            phone: '02-1234-5678'
          },
          items: [
            { name: '노트북 거치대', spec: '알루미늄', qty: 3, price: 45000, remarks: '' },
            { name: '무선 키보드', spec: '한글 각인', qty: 5, price: 32900, remarks: '' },
            { name: '설치 출장비', spec: '서울', qty: 1, price: 150000, remarks: '' }
          ],
          footerNote: ''
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return createDefaultState();
          return parsed;
        } catch (e) {
          return createDefaultState();
        }
      }

      let state = loadState();

      const els = {
        saveStatus: document.getElementById('saveStatus'),
        recipientCompany: document.getElementById('recipientCompany'),
        recipientPerson: document.getElementById('recipientPerson'),
        quoteNumber: document.getElementById('quoteNumber'),
        quoteDate: document.getElementById('quoteDate'),
        validUntil: document.getElementById('validUntil'),
        supName: document.getElementById('supName'),
        supCeo: document.getElementById('supCeo'),
        supBizNo: document.getElementById('supBizNo'),
        supAddress: document.getElementById('supAddress'),
        supPhone: document.getElementById('supPhone'),
        koreanTotalDisplay: document.getElementById('koreanTotalDisplay'),
        itemsBody: document.getElementById('itemsBody'),
        subtotalDisplay: document.getElementById('subtotalDisplay'),
        vatDisplay: document.getElementById('vatDisplay'),
        grandTotalDisplay: document.getElementById('grandTotalDisplay'),
        footerNote: document.getElementById('footerNote'),
        btnAddItem: document.getElementById('btnAddItem'),
        btnPrint: document.getElementById('btnPrint'),
        btnNewQuote: document.getElementById('btnNewQuote')
      };

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          els.saveStatus.textContent = '자동 저장됨';
        } catch (e) {
          els.saveStatus.textContent = '저장 공간 부족';
        }
      }

      function updateTotalsUI() {
        const { supplyAmount, vat, grandTotal } = calculateTotals(state.items);
        els.koreanTotalDisplay.textContent = formatKoreanTotal(grandTotal);
        els.subtotalDisplay.textContent = `${formatNumber(supplyAmount)} 원`;
        els.vatDisplay.textContent = `${formatNumber(vat)} 원`;
        els.grandTotalDisplay.textContent = `${formatNumber(grandTotal)} 원`;
      }

      function renderItems() {
        els.itemsBody.innerHTML = '';

        if (!state.items || state.items.length === 0) {
          const emptyTr = document.createElement('tr');
          emptyTr.className = 'empty-row';
          emptyTr.innerHTML = `
            <td colspan="7">품목이 없습니다. 위의 '+ 품목 추가' 버튼을 눌러 추가하세요.</td>
            <td class="col-action"></td>
          `;
          els.itemsBody.appendChild(emptyTr);
          updateTotalsUI();
          return;
        }

        state.items.forEach((item, idx) => {
          const tr = document.createElement('tr');
          const qty = sanitizeNonNegativeNumber(item.qty);
          const price = sanitizeNonNegativeNumber(item.price);
          const amount = qty * price;

          tr.innerHTML = `
            <td class="text-center num">${idx + 1}</td>
            <td><input type="text" class="field" data-field="name" placeholder="품목명" /></td>
            <td><input type="text" class="field text-center" data-field="spec" placeholder="규격" /></td>
            <td><input type="text" inputmode="numeric" class="field num text-right" data-field="qty" placeholder="0" /></td>
            <td><input type="text" inputmode="numeric" class="field num text-right" data-field="price" placeholder="0" /></td>
            <td class="amount-cell num" data-role="amount">${formatNumber(amount)}</td>
            <td class="col-remarks"><input type="text" class="field" data-field="remarks" placeholder="" /></td>
            <td class="col-action"><button type="button" class="btn-del" title="줄 삭제" aria-label="${idx + 1}번 품목 삭제">✕</button></td>
          `;

          const nameInput = tr.querySelector('[data-field="name"]');
          const specInput = tr.querySelector('[data-field="spec"]');
          const qtyInput = tr.querySelector('[data-field="qty"]');
          const priceInput = tr.querySelector('[data-field="price"]');
          const remarksInput = tr.querySelector('[data-field="remarks"]');
          const amountCell = tr.querySelector('[data-role="amount"]');
          const delBtn = tr.querySelector('.btn-del');

          nameInput.value = item.name || '';
          specInput.value = item.spec || '';
          qtyInput.value = formatNumber(qty);
          priceInput.value = formatNumber(price);
          remarksInput.value = item.remarks || '';

          nameInput.addEventListener('input', (e) => {
            state.items[idx].name = e.target.value;
            saveState();
          });

          specInput.addEventListener('input', (e) => {
            state.items[idx].spec = e.target.value;
            saveState();
          });

          remarksInput.addEventListener('input', (e) => {
            state.items[idx].remarks = e.target.value;
            saveState();
          });

          function handleNumericInput(fieldKey, inputEl) {
            const val = sanitizeNonNegativeNumber(inputEl.value);
            state.items[idx][fieldKey] = val;
            const rowAmount = sanitizeNonNegativeNumber(state.items[idx].qty) * sanitizeNonNegativeNumber(state.items[idx].price);
            amountCell.textContent = formatNumber(rowAmount);
            updateTotalsUI();
            saveState();
          }

          qtyInput.addEventListener('focus', () => {
            qtyInput.value = String(sanitizeNonNegativeNumber(state.items[idx].qty));
            qtyInput.select();
          });
          qtyInput.addEventListener('input', () => handleNumericInput('qty', qtyInput));
          qtyInput.addEventListener('blur', () => {
            qtyInput.value = formatNumber(state.items[idx].qty);
          });

          priceInput.addEventListener('focus', () => {
            priceInput.value = String(sanitizeNonNegativeNumber(state.items[idx].price));
            priceInput.select();
          });
          priceInput.addEventListener('input', () => handleNumericInput('price', priceInput));
          priceInput.addEventListener('blur', () => {
            priceInput.value = formatNumber(state.items[idx].price);
          });

          delBtn.addEventListener('click', () => {
            state.items.splice(idx, 1);
            saveState();
            renderItems();
          });

          els.itemsBody.appendChild(tr);
        });

        updateTotalsUI();
      }

      function renderHeader() {
        els.recipientCompany.value = state.recipientCompany || '';
        els.recipientPerson.value = state.recipientPerson || '';
        els.quoteNumber.value = state.quoteNumber || '';
        els.quoteDate.value = state.quoteDate || formatDate(new Date());
        els.validUntil.value = state.validUntil || addDays(els.quoteDate.value, 30);

        const sup = state.supplier || {};
        els.supName.value = sup.name || '';
        els.supCeo.value = sup.ceo || '';
        els.supBizNo.value = sup.bizNo || '';
        els.supAddress.value = sup.address || '';
        els.supPhone.value = sup.phone || '';
        els.footerNote.value = state.footerNote || '';
      }

      function bindHeaderEvents() {
        els.recipientCompany.addEventListener('input', (e) => {
          state.recipientCompany = e.target.value;
          saveState();
        });
        els.recipientPerson.addEventListener('input', (e) => {
          state.recipientPerson = e.target.value;
          saveState();
        });
        els.quoteNumber.addEventListener('input', (e) => {
          state.quoteNumber = e.target.value;
          saveState();
        });
        els.quoteDate.addEventListener('change', (e) => {
          state.quoteDate = e.target.value;
          saveState();
        });
        els.validUntil.addEventListener('change', (e) => {
          state.validUntil = e.target.value;
          saveState();
        });

        els.supName.addEventListener('input', (e) => {
          state.supplier.name = e.target.value;
          saveState();
        });
        els.supCeo.addEventListener('input', (e) => {
          state.supplier.ceo = e.target.value;
          saveState();
        });
        els.supBizNo.addEventListener('input', (e) => {
          state.supplier.bizNo = e.target.value;
          saveState();
        });
        els.supAddress.addEventListener('input', (e) => {
          state.supplier.address = e.target.value;
          saveState();
        });
        els.supPhone.addEventListener('input', (e) => {
          state.supplier.phone = e.target.value;
          saveState();
        });
        els.footerNote.addEventListener('input', (e) => {
          state.footerNote = e.target.value;
          saveState();
        });
      }

      els.btnAddItem.addEventListener('click', () => {
        state.items.push({ name: '', spec: '', qty: 1, price: 0, remarks: '' });
        saveState();
        renderItems();
        const rows = els.itemsBody.querySelectorAll('tr');
        const lastRow = rows[rows.length - 1];
        if (lastRow) {
          const nameInput = lastRow.querySelector('[data-field="name"]');
          if (nameInput) nameInput.focus();
        }
      });

      els.btnPrint.addEventListener('click', () => {
        window.print();
      });

      els.btnNewQuote.addEventListener('click', () => {
        if (!window.confirm('현재 품목을 비우고 새 견적서를 작성할까요?')) {
          return;
        }
        const today = formatDate(new Date());
        state.recipientCompany = '';
        state.recipientPerson = '';
        state.quoteDate = today;
        state.validUntil = addDays(today, 30);
        state.quoteNumber = nextQuoteNumber(today);
        state.items = [];
        state.footerNote = '';
        saveState();
        renderHeader();
        renderItems();
        els.recipientCompany.focus();
      });

      // 초기 렌더링
      bindHeaderEvents();
      renderHeader();
      renderItems();
    })();
  </script>
</body>
</html>
